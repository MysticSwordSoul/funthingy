<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subject Tracker</title>
<style>
:root{--bg:#0b1210;--card:#0f1a16;--line:#1e3a2e;--g:#4ade80;--g2:#22c55e;--tx:#e6f0ea;--mut:#8aa398;--pill:#16251f;--pillx:#6f8579;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 90% 40%,#10241a 0,transparent 70%),var(--bg);color:var(--tx);font:13px/1.2 "Segoe UI",system-ui,Arial,sans-serif;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
h1{font:700 20px Georgia,"Times New Roman",serif;margin:0}
.pct{color:var(--g);font-weight:700;font-size:15px}
.bar{flex:1;height:10px;background:#16251f;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g2);transition:width .3s}
.btn{background:transparent;border:1px solid var(--g2);color:var(--g);padding:5px 14px;border-radius:7px;cursor:pointer;font:inherit}
.btn.on{background:var(--g2);color:#04130a}
.btn.reset{border-color:var(--line);color:var(--mut)}
.wrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(3,minmax(470px,1fr));gap:10px;min-width:1480px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px 14px}
.hd{display:flex;align-items:baseline;margin-bottom:6px}
.hd h2{margin:0;font:700 16px Georgia,serif;width:110px}
.hd h2 small{font:600 11px "Segoe UI",sans-serif;color:var(--g);margin-left:4px}
.cols{display:flex;align-items:center;color:var(--mut);font-size:9.5px}
.cols span{width:27px;text-align:center}
.cols b{font-weight:400;margin-left:8px}
.row{display:flex;align-items:center;min-height:27px}
.row.hide{display:none}
.nm{width:123px;font-size:12px;line-height:1.05;padding-right:4px;flex:none}
.cb{width:19px;height:19px;border-radius:5px;border:1.5px solid #2f5a45;background:transparent;margin:0 4px;padding:0;cursor:pointer;flex:none;color:#04130a;font-size:13px;font-weight:900;line-height:16px}
.cb.on{background:var(--g2);border-color:var(--g2)}
.bk{display:flex;gap:5px;margin-left:8px;flex:1}
.pill{background:var(--pill);color:var(--pillx);border:0;border-radius:12px;padding:3px 7px;font-size:10px;cursor:pointer;white-space:nowrap}
.pill.on{background:#4ade80;color:#04130a;font-weight:600;background:#3fcf74}
</style></head><body>
<header><h1>Subject Tracker</h1><span class="pct" id="tot">0%</span><div class="bar"><i id="fill"></i></div>
<button class="btn" id="nd">Not done</button><button class="btn reset" id="rs">Reset</button></header>
<div class="wrap"><div class="grid" id="g"></div></div>
<script>
const HEAD=["Theory","2019","2020","2023","2024","Revision"];
const PH=["Irodov","SBT","Pathfinder (optional)"];
const S=[
{n:"Physics",rows:[["Kinematics"],["NLM & Friction"],["WPE & Circular Motion"],["Centre of Mass"],["Rotational Motion"],["Atomic Physics"],["Dual Nature"],["Nuclear Physics"],["KTG"],["Thermal Properties of Matter"],["Thermodynamics"],["Fluids"],["Properties of Matter"],["SHM"],["Electrostatics"],["Gravitation"],["Capacitance"],["Current Electricity"],["Magnetic Effect of Current"],["Magnetic Effects of Matter"],["Alternating Current"],["EMI"],["Wave Optics"],["Geometrical Optics"],["Strings & Sound"],["Semiconductor"]].map(r=>[r[0],PH])},
{n:"Chemistry",rows:[
...["Mole Concept","Atomic Structure","Liquid Solution","Electrochemistry","Chemical Kinetics","Chemical Equilibrium","Ionic Equilibrium","Redox & Equivalent Concept","Thermodynamics"].map(t=>[t,["N Awasthi (PC)","JEE Adv PYQ"]]),
...["Periodic Table","Chemical Bonding"].map(t=>[t,["JEE Adv PYQ"]]),
...["GOC","Isomerism","Hydrocarbon","Alkyl Halide","Alcohol, Phenol, Ethers","Aldehyde & Ketone","Carboxylic Acid & Derivatives","Amines","Biomolecules"].map(t=>[t,["MS Chouhan (OC)","JEE Adv PYQ"]]),
...["Coordination","d & f-Block","p-Block","Salt Analysis"].map(t=>[t,["JEE Adv PYQ"]])]},
{n:"Maths",rows:[
...["Quadratic Equations","Sequence & Series","Trigonometric Functions","Trigonometric Equations","Permutation & Combination","Binomial Theorem","Straight Lines","Circle","Parabola","Ellipse","Hyperbola","Matrices","Determinants","Basic Maths & Sets","Function","ITF"].map(t=>[t,["Black Book","JEE Adv PYQ"]]),
...["Limits","Continuity & Differentiability","Application of Derivatives","Indefinite Integration","Definite Integration","Area Under Curve","Differential Equations"].map(t=>[t,["Sameer Bansal","JEE Adv PYQ"]]),
...["Vector","3D","Complex Numbers","Probability","Statistics"].map(t=>[t,["Black Book","JEE Adv PYQ"]])]}
];
const KEY="subject-tracker-v1";let st={},nd=false;
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const g=document.getElementById("g");
function render(){
 let all=0,done=0;
 g.innerHTML="";
 S.forEach((s,si)=>{
  let sd=0;
  const c=document.createElement("div");c.className="card";
  const rowsEl=s.rows.map((r,ri)=>{
   const el=document.createElement("div");el.className="row";
   let full=true;
   let h=`<div class="nm">${r[0]}</div>`;
   HEAD.forEach((_,ci)=>{const k=`${si}.${ri}.c${ci}`;const on=!!st[k];all++;if(on){done++;sd++}else full=false;
    h+=`<button class="cb${on?" on":""}" data-k="${k}">${on?"✓":""}</button>`});
   h+=`<div class="bk">`+r[1].map((b,bi)=>{const k=`${si}.${ri}.b${bi}`;return `<button class="pill${st[k]?" on":""}" data-k="${k}">${b}</button>`}).join("")+`</div>`;
   el.innerHTML=h;if(nd&&full)el.classList.add("hide");return el});
  const tot=s.rows.length*HEAD.length;
  c.innerHTML=`<div class="hd"><h2>${s.n}<small>${Math.round(sd/tot*100)}%</small></h2><div class="cols">${HEAD.map(x=>`<span>${x}</span>`).join("")}<b>Other Books (Adv)</b></div></div>`;
  rowsEl.forEach(e=>c.appendChild(e));g.appendChild(c);
 });
 const p=Math.round(done/all*100);
 document.getElementById("tot").textContent=p+"%";
 document.getElementById("fill").style.width=p+"%";
 document.getElementById("nd").classList.toggle("on",nd);
}
g.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;
 const k=b.dataset.k;st[k]=!st[k];if(!st[k])delete st[k];save();render()});
document.getElementById("nd").onclick=()=>{nd=!nd;render()};
document.getElementById("rs").onclick=()=>{if(confirm("Reset all progress?")){st={};save();render()}};
render();
</script></body></html>
